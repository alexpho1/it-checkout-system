{% extends "base.html" %}
{% block title %}Check In{% endblock %}

{% block content %}
<h1>Check In</h1>
<p class="subtitle">Return an item to inventory.</p>

<div class="card card-narrow">
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form action="/checkin" method="POST">
        <div class="field">
            <label for="checkout_id">Checked-out item</label>
            <select id="checkout_id" name="checkout_id" required>
                {% for checkout in checkouts %}
                <option value="{{ checkout.CheckoutID }}">{{ checkout.ItemName }} - {{ checkout.FullName }} - {{ checkout.DueDate }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn">Check In</button>
            <a class="link-back" href="{{ url_for('items') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
